<!-- contact.component.html -->
<section id="contact">
  <div class="section-inner">

    <p class="section-tag reveal">Let's talk</p>
    <h2 class="section-title reveal">Get in touch</h2>

    <p class="contact-intro reveal">
      I'm currently open to new opportunities and collaborations.<br>
      Whether it's a project, a question or just a hello — my inbox is always open.
    </p>

    <div class="contact-grid reveal">

      <!-- GitHub -->
      <div class="contact-card" (click)="Git()">
        <div class="contact-icon">🐙</div>
        <h4>GitHub</h4>
        <p>DantePileckas</p>
        <div class="contact-accent" style="background: #333;"></div>
      </div>

      <!-- LinkedIn -->
      <div class="contact-card" (click)="Linkedin()">
        <div class="contact-icon">💼</div>
        <h4>LinkedIn</h4>
        <p>Dante Pileckas</p>
        <div class="contact-accent" style="background: #0A66C2;"></div>
      </div>

      <!-- Behance -->
      <div class="contact-card" (click)="Behance()">
        <div class="contact-icon">🎨</div>
        <h4>Behance</h4>
        <p>Dante Pileckas</p>
        <div class="contact-accent" style="background: #1769FF;"></div>
      </div>

      <!-- Email -->
      <div class="contact-card">
        <div class="contact-icon">✉️</div>
        <h4>Email</h4>
        <p>pileckas33@gmail.com</p>
        <div class="contact-accent" style="background: var(--accent);"></div>
      </div>

    </div>
  </div>
</section>
